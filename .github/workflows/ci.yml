name: CI

on:
  push:
  pull_request:

# A newer push supersedes a run still in progress on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP 8.3, MySQL 8.0)
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      APP_ENV: local
      SAQF_DEMO: "true"
      SAQF_DB_HOST: 127.0.0.1
      SAQF_DB_PORT: "3306"
      SAQF_DB_NAME: saqf
      SAQF_DB_USER: root
      SAQF_DB_PASS: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring, curl, openssl
          coverage: none
      - name: Allow the append-only audit triggers (binary logging is on)
        run: mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1;"
      - name: Lint
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Automation scenarios
        run: php bin/install.php --demo --fresh && php tests/automation_test.php
      - name: Connectors, semester cycle, accounts, e-mail, SSO tokens
        run: php bin/install.php --demo --fresh && php tests/production_test.php
      - name: HTTP, authorization and security
        run: |
          php bin/install.php --demo --fresh
          php -S 127.0.0.1:8080 -t public > /tmp/saqf-server.log 2>&1 &
          php tests/http_smoke.php http://127.0.0.1:8080
      - name: University sign-in end to end
        run: php bin/install.php --demo --fresh && php tests/sso_test.php
      - name: Sections, import, evidence, Word exports, two-step sign-in, alerts, Arabic
        run: php bin/install.php --demo --fresh && php tests/features_test.php
      - name: Plain wording, whole numbers, Arabic course content
        run: php bin/install.php --demo --fresh && php tests/wording_test.php
      - name: Go-live readiness, data pack, access review, live security self-test
        run: php bin/install.php --demo --fresh && php tests/readiness_test.php
      - name: Robot check, two-step codes for everyone, trusted browsers, session timer, help
        run: php bin/install.php --demo --fresh && php tests/signin_test.php
      - name: Privacy and security hardening (pseudonyms, application key, https only, backup status, SSO MFA claim)
        run: php bin/install.php --demo --fresh && php tests/hardening_test.php
      - name: Course file closeout, evidence review by a person, course file package
        run: php bin/install.php --demo --fresh && php tests/closeout_test.php
      - name: Upgrade path (migrations are idempotent)
        run: php bin/migrate.php && php bin/migrate.php --status

  docker:
    name: Docker stack (HTTPS, encrypted backups)
    runs-on: ubuntu-24.04
    env:
      SAQF_BACKUP_PASSPHRASE: ci-only-backup-passphrase
      SAQF_BACKUP_START_DELAY: "99999"
    steps:
      - uses: actions/checkout@v4
      - name: Build and start (demo, with the HTTPS proxy)
        run: docker compose --profile https up -d --build
      - name: Wait until healthy
        run: |
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)")" = healthy ] && exit 0
            sleep 5
          done
          docker compose logs app
          exit 1
      - name: HTTP and security tests against Apache
        run: docker compose exec -T app php tests/http_smoke.php http://127.0.0.1
      - name: HTTPS through the bundled proxy (secure cookie, HSTS, HTTP redirected)
        run: |
          for i in $(seq 1 30); do curl -skfI https://localhost/login.php > /tmp/https.txt && break; sleep 2; done
          cat /tmp/https.txt
          grep -qi '^strict-transport-security' /tmp/https.txt
          grep -qi 'set-cookie: SAQFSESSID=.*secure' /tmp/https.txt
          curl -sI http://localhost/login.php | grep -qi '^location: https://'
      - name: Encrypted backup, verified and reported to SAQF
        run: |
          docker compose exec -T backup sh /usr/local/bin/saqf-backup
          ls -l backups/
          ls backups/ | grep -q 'sql.gz.enc$'
          docker compose exec -T app cat storage/backups/last-backup.json | tee /tmp/status.json
          grep -q '"status":"ok"' /tmp/status.json && grep -q '"encrypted":true' /tmp/status.json
      - name: Restore drill (database and evidence files, then audit chain)
        run: |
          docker compose stop app
          docker compose run --rm --entrypoint sh backup /usr/local/bin/saqf-restore "$(ls backups | grep 'sql.gz.enc$' | tail -1)"
          docker compose start app
          sleep 5
          docker compose exec -T app php bin/verify_audit.php
      - name: Logs on failure
        if: failure()
        run: docker compose logs

  hardened:
    name: Hardened production stack (secret files, read-only, capabilities dropped)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Generate secret files and production settings
        run: |
          sh bin/make_secrets.sh
          printf 'APP_ENV=production\nSAQF_DEMO=false\nSAQF_AUTO_INSTALL=production\nSAQF_BASE_URL=https://localhost\nSAQF_DOMAIN=localhost\nSAQF_BACKUP_START_DELAY=99999\n' > .env
      - name: Start with the production overrides and the HTTPS proxy
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile https up -d --build
      - name: Wait until healthy
        run: |
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)")" = healthy ] && exit 0
            sleep 5
          done
          docker compose logs app
          exit 1
      - name: Health reports an application key that came from a file
        run: |
          curl -fsS http://127.0.0.1:8080/health.php | tee /tmp/health.json
          grep -q '"app_key":"ok"' /tmp/health.json
      - name: Hardening is really applied
        run: |
          app=$(docker compose ps -q app)
          [ "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$app")" = true ]
          docker inspect -f '{{.HostConfig.SecurityOpt}}' "$app" | grep -q 'no-new-privileges'
          docker inspect -f '{{.HostConfig.CapDrop}}' "$app" | grep -q 'ALL'
          if docker compose exec -T app sh -c 'touch /var/www/saqf/should-fail' 2>/dev/null; then echo "root file system is writable"; exit 1; fi
          echo "read-only root file system, no-new-privileges and dropped capabilities confirmed"
      - name: No secret value is visible in the container configuration
        run: |
          key=$(cat secrets/saqf_app_key); dbp=$(cat secrets/saqf_db_pass)
          docker inspect "$(docker compose ps -q app)" "$(docker compose ps -q db)" > /tmp/inspect.json
          if grep -qF "$key" /tmp/inspect.json || grep -qF "$dbp" /tmp/inspect.json; then echo "a secret leaked into docker inspect"; exit 1; fi
          echo "secrets are not in docker inspect output"
      - name: The scheduler does not run as root
        run: |
          sleep 10
          docker compose exec -T app sh -c 'ps -eo user,args | grep "[b]in/tick.php" || true' | tee /tmp/ps.txt
          if grep -q '^root' /tmp/ps.txt; then echo "scheduler runs as root"; exit 1; fi
      - name: HTTPS, secure cookie and HSTS through the proxy
        run: |
          for i in $(seq 1 30); do curl -skfI https://localhost/login.php > /tmp/https.txt && break; sleep 2; done
          cat /tmp/https.txt
          grep -qi '^strict-transport-security' /tmp/https.txt
          grep -qi 'set-cookie: SAQFSESSID=.*secure' /tmp/https.txt
      - name: Production preflight runs inside the container
        run: |
          docker compose exec -T app php bin/preflight.php | tee /tmp/preflight.txt || true
          grep -q 'Application key from the environment' /tmp/preflight.txt
          grep -A1 'BLOCK.*Application key' /tmp/preflight.txt && exit 1 || true
          grep -q 'No account uses the published demo password' /tmp/preflight.txt
      - name: Backup with the passphrase from a file is encrypted and verified
        run: |
          docker compose exec -T backup sh /usr/local/bin/saqf-backup
          ls backups | grep -q 'sql.gz.enc$'
          docker compose exec -T app cat storage/backups/last-backup.json | tee /tmp/status.json
          grep -q '"status":"ok"' /tmp/status.json && grep -q '"encrypted":true' /tmp/status.json
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml logs
