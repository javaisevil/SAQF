# SAQF Apache hardening (document root is /var/www/saqf/public)
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
<Directory /var/www/saqf/public>
    Options -Indexes -FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
<Files "_init.php">
    Require all denied
</Files>
<FilesMatch "\.(sql|log|bak|env|md|json)$">
    Require all denied
</FilesMatch>
