# SAQF Apache hardening (document root is /var/www/saqf/public)
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
<Directory /var/www/saqf/public>
    Options -Indexes -FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
<Files "_init.php">
    Require all denied
</Files>
<FilesMatch "\.(sql|log|bak|env|md|json)$">
    Require all denied
</FilesMatch>

# RFC 9116: the published security contact (public/security_txt.php builds it from SAQF_SECURITY_CONTACT)
RewriteEngine On
RewriteRule ^/\.well-known/security\.txt$ /security_txt.php [L]
<Location "/.well-known/security.txt">
    Require all granted
</Location>
