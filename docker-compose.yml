services:
  aqms:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      AQMS_DB_HOST: db
      AQMS_DB_PORT: 3306
      AQMS_DB_NAME: AQMS_db
      AQMS_DB_USER: aqms
      AQMS_DB_PASS: ${AQMS_DB_PASS:-change-me-local}
      UNIVERSITY_NAME: Al Yamamah University
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: AQMS_db
      MYSQL_USER: aqms
      MYSQL_PASSWORD: ${AQMS_DB_PASS:-change-me-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    volumes:
      - aqms_mysql:/var/lib/mysql
      - ./database/AQMS_db.sql:/docker-entrypoint-initdb.d/01-aqms.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uaqms -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  aqms_mysql:
