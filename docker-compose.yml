# Local / demo stack:   cp .env.example .env   (edit passwords)   then   docker compose up --build
# Open http://localhost:8080  — demo accounts are listed on the sign-in page while SAQF_DEMO is on.
# Production: set APP_ENV=production, SAQF_AUTO_INSTALL=production and the connector, SSO and mail
# settings in .env (see .env.example and docs/OPERATIONS.md), then start with the HTTPS proxy:
#   docker compose --profile https up -d --build          (+ --profile antivirus for upload scanning)
services:
  app:
    build: .
    ports:
      - "${SAQF_PORT:-8080}:80"
    environment:
      APP_ENV: ${APP_ENV:-demo}
      APP_DEBUG: ${APP_DEBUG:-false}
      SAQF_DEMO: ${SAQF_DEMO:-true}
      SAQF_DEMO_CLOCK: ${SAQF_DEMO_CLOCK:-}
      SAQF_AUTO_INSTALL: ${SAQF_AUTO_INSTALL:-demo}
      SAQF_DB_HOST: db
      SAQF_DB_PORT: 3306
      SAQF_DB_NAME: ${SAQF_DB_NAME:-saqf}
      SAQF_DB_USER: ${SAQF_DB_USER:-saqf}
      SAQF_DB_PASS: ${SAQF_DB_PASS:-change-me-local}
      SAQF_TRUST_PROXY: ${SAQF_TRUST_PROXY:-false}
      # Only the bundled HTTPS proxy (fixed address below) may tell SAQF the client's address.
      SAQF_TRUSTED_PROXIES: ${SAQF_TRUSTED_PROXIES:-172.28.250.10}
      SAQF_BASE_URL: ${SAQF_BASE_URL:-}
      SAQF_APP_KEY: ${SAQF_APP_KEY:-}
      # Security and operations (docs/OPERATIONS.md)
      SAQF_ADMIN_ALLOWED_IPS: ${SAQF_ADMIN_ALLOWED_IPS:-}
      SAQF_ALERT_WEBHOOK: ${SAQF_ALERT_WEBHOOK:-}
      SAQF_CLAMAV_HOST: ${SAQF_CLAMAV_HOST:-}
      SAQF_BOT_CHECK: ${SAQF_BOT_CHECK:-}
      SAQF_SECURITY_CONTACT: ${SAQF_SECURITY_CONTACT:-}
      SAQF_WITNESS_EMAIL: ${SAQF_WITNESS_EMAIL:-}
      SAQF_STORAGE_DIR: /var/www/saqf/storage/evidence
      SAQF_BACKUP_MONITOR_DIR: /var/www/saqf/storage/backups
      # University systems (docs/INTEGRATIONS.md)
      SAQF_INSTITUTION_DIR: ${SAQF_INSTITUTION_DIR:-}
      SAQF_SIS_SOURCE: ${SAQF_SIS_SOURCE:-}
      SAQF_SIS_URL: ${SAQF_SIS_URL:-}
      SAQF_SIS_TOKEN: ${SAQF_SIS_TOKEN:-}
      # Mapped connectors (any JSON API, described by a mapping file in ./config/mappings)
      SAQF_SIS_MAPPING: ${SAQF_SIS_MAPPING:-}
      SAQF_SIS_CLIENT_ID: ${SAQF_SIS_CLIENT_ID:-}
      SAQF_SIS_CLIENT_SECRET: ${SAQF_SIS_CLIENT_SECRET:-}
      SAQF_LMS_SOURCE: ${SAQF_LMS_SOURCE:-}
      SAQF_LMS_MAPPING: ${SAQF_LMS_MAPPING:-}
      SAQF_LMS_URL: ${SAQF_LMS_URL:-}
      SAQF_LMS_TOKEN: ${SAQF_LMS_TOKEN:-}
      SAQF_LMS_CLIENT_ID: ${SAQF_LMS_CLIENT_ID:-}
      SAQF_LMS_CLIENT_SECRET: ${SAQF_LMS_CLIENT_SECRET:-}
      SAQF_LMS_COURSE_KEY: ${SAQF_LMS_COURSE_KEY:-}
      SAQF_LMS_POLL_MINUTES: ${SAQF_LMS_POLL_MINUTES:-}
      SAQF_MOODLE_URL: ${SAQF_MOODLE_URL:-}
      SAQF_MOODLE_TOKEN: ${SAQF_MOODLE_TOKEN:-}
      SAQF_MOODLE_COURSE_FIELD: ${SAQF_MOODLE_COURSE_FIELD:-}
      SAQF_BLACKBOARD_URL: ${SAQF_BLACKBOARD_URL:-}
      SAQF_BLACKBOARD_KEY: ${SAQF_BLACKBOARD_KEY:-}
      SAQF_BLACKBOARD_SECRET: ${SAQF_BLACKBOARD_SECRET:-}
      # University sign-in (OpenID Connect)
      SAQF_OIDC_ISSUER: ${SAQF_OIDC_ISSUER:-}
      SAQF_OIDC_CLIENT_ID: ${SAQF_OIDC_CLIENT_ID:-}
      SAQF_OIDC_CLIENT_SECRET: ${SAQF_OIDC_CLIENT_SECRET:-}
      SAQF_OIDC_REDIRECT_URI: ${SAQF_OIDC_REDIRECT_URI:-}
      SAQF_OIDC_SCOPES: ${SAQF_OIDC_SCOPES:-}
      SAQF_OIDC_USERNAME_CLAIM: ${SAQF_OIDC_USERNAME_CLAIM:-}
      SAQF_OIDC_ROLE_CLAIM: ${SAQF_OIDC_ROLE_CLAIM:-}
      SAQF_OIDC_ROLE_MAP: ${SAQF_OIDC_ROLE_MAP:-}
      SAQF_OIDC_AUTO_PROVISION: ${SAQF_OIDC_AUTO_PROVISION:-}
      SAQF_OIDC_DEFAULT_ROLE: ${SAQF_OIDC_DEFAULT_ROLE:-}
      SAQF_OIDC_CLIENT_AUTH: ${SAQF_OIDC_CLIENT_AUTH:-}
      SAQF_OIDC_BUTTON_LABEL: ${SAQF_OIDC_BUTTON_LABEL:-}
      SAQF_OIDC_REQUIRE_MFA: ${SAQF_OIDC_REQUIRE_MFA:-}
      SAQF_PASSWORD_LOGIN: ${SAQF_PASSWORD_LOGIN:-}
      # E-mail
      SAQF_MAIL_TRANSPORT: ${SAQF_MAIL_TRANSPORT:-}
      SAQF_MAIL_HOST: ${SAQF_MAIL_HOST:-}
      SAQF_MAIL_PORT: ${SAQF_MAIL_PORT:-}
      SAQF_MAIL_ENCRYPTION: ${SAQF_MAIL_ENCRYPTION:-}
      SAQF_MAIL_USERNAME: ${SAQF_MAIL_USERNAME:-}
      SAQF_MAIL_PASSWORD: ${SAQF_MAIL_PASSWORD:-}
      SAQF_MAIL_FROM: ${SAQF_MAIL_FROM:-}
      SAQF_MAIL_FROM_NAME: ${SAQF_MAIL_FROM_NAME:-}
    volumes:
      # SIS / LMS export drop folders (read-only for SAQF)
      - ./storage/inbox:/var/www/saqf/storage/inbox:ro
      # Mapping files for the mapped connectors (SAQF_SIS_MAPPING=config/mappings/sis.json); data only, never executed
      - ./config/mappings:/var/www/saqf/config/mappings:ro
      # Course-file evidence (outside the web root; included in every backup)
      - saqf_evidence:/var/www/saqf/storage/evidence
      # Backup status written by the backup service (System health and IT alerts read it)
      - saqf_backup_status:/var/www/saqf/storage/backups:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    # Triggers that make the audit log append-only need this flag when binary logging is on (MySQL 8 default).
    command: ["--log-bin-trust-function-creators=1", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${SAQF_DB_NAME:-saqf}
      MYSQL_USER: ${SAQF_DB_USER:-saqf}
      MYSQL_PASSWORD: ${SAQF_DB_PASS:-change-me-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      TZ: Asia/Riyadh
    volumes:
      - saqf_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Nightly backups into ./backups (database + evidence files, kept SAQF_BACKUP_KEEP_DAYS days), each
  # verified after writing; encrypted with SAQF_BACKUP_PASSPHRASE and copied to SAQF_BACKUP_OFFSITE_PATH
  # (a mounted network share or second disk) when those are set. Restore: docker/restore.sh.
  backup:
    image: mysql:8.0
    entrypoint: ["sh", "/usr/local/bin/saqf-backup", "--loop"]
    environment:
      SAQF_DB_HOST: db
      SAQF_DB_NAME: ${SAQF_DB_NAME:-saqf}
      SAQF_DB_USER: ${SAQF_DB_USER:-saqf}
      SAQF_DB_PASS: ${SAQF_DB_PASS:-change-me-local}
      SAQF_BACKUP_KEEP_DAYS: ${SAQF_BACKUP_KEEP_DAYS:-14}
      SAQF_BACKUP_INTERVAL_HOURS: ${SAQF_BACKUP_INTERVAL_HOURS:-24}
      SAQF_BACKUP_START_DELAY: ${SAQF_BACKUP_START_DELAY:-900}
      SAQF_BACKUP_PASSPHRASE: ${SAQF_BACKUP_PASSPHRASE:-}
      SAQF_BACKUP_OFFSITE_DIR: ${SAQF_BACKUP_OFFSITE_PATH:+/offsite}
      SAQF_DRILL_EVERY_DAYS: ${SAQF_DRILL_EVERY_DAYS:-30}
      TZ: Asia/Riyadh
    volumes:
      - ./docker/backup.sh:/usr/local/bin/saqf-backup:ro
      - ./docker/restore.sh:/usr/local/bin/saqf-restore:ro
      - ./docker/restore_drill.sh:/usr/local/bin/saqf-restore-drill:ro
      - ./backups:/backups
      - ${SAQF_BACKUP_OFFSITE_PATH:-./backups/offsite-not-configured}:/offsite
      - saqf_evidence:/evidence
      - saqf_backup_status:/status
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # HTTPS in front of SAQF (profile "https"): automatic certificates for a public SAQF_DOMAIN,
  # a local certificate for "localhost". HTTP is redirected to HTTPS; HSTS is sent by SAQF.
  proxy:
    image: caddy:2
    profiles: ["https"]
    ports:
      - "${SAQF_HTTP_PORT:-80}:80"
      - "${SAQF_HTTPS_PORT:-443}:443"
    environment:
      SAQF_DOMAIN: ${SAQF_DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - saqf_caddy_data:/data
      - saqf_caddy_config:/config
    networks:
      default:
        ipv4_address: 172.28.250.10
    depends_on:
      - app
    restart: unless-stopped

  # Virus scanning of evidence uploads (profile "antivirus"); set SAQF_CLAMAV_HOST=clamav:3310.
  clamav:
    image: clamav/clamav:stable
    profiles: ["antivirus"]
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        # Fixed range so the HTTPS proxy has a known address (SAQF_TRUSTED_PROXIES); dynamic
        # addresses come from the upper half only.
        - subnet: 172.28.250.0/24
          ip_range: 172.28.250.128/25

volumes:
  saqf_mysql:
  saqf_evidence:
  saqf_backup_status:
  saqf_caddy_data:
  saqf_caddy_config:
